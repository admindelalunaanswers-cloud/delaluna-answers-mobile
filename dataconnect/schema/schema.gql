type User @table {
  firebaseAuthId: String!
  createdAt: Timestamp!
  displayName: String
  email: String
  photoUrl: String
}

type BirthChart @table {
  user: User!
  name: String!
  birthDate: Date!
  birthTime: String!
  birthLocation: String!
  notes: String
}

type CelestialEvent @table {
  name: String!
  eventDate: Timestamp!
  eventType: String!
  description: String
  imageUrl: String
}

type Article @table {
  title: String!
  content: String!
  category: String!
  imageUrl: String
  author: String
}

type HoroscopeReading @table {
  user: User!
  readingText: String!
  readingType: String!
  readingDate: Date!
  relatedZodiacSign: String
}